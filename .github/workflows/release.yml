name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish checksummed GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build release archive and checksum
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          mkdir release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          sha256sum "sustech-course-advisor-$package_version.tgz" > "sustech-course-advisor-$package_version.tgz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/sustech-course-advisor-*.tgz
          release-assets/sustech-course-advisor-*.tgz.sha256
          --verify-tag
          --generate-notes
          --title "SUSTech Course Advisor $GITHUB_REF_NAME"
