name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 20 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate Skill and privacy boundaries
        run: npm run validate:skill && npm run privacy:tracked && npm run license:check

      - name: Validate POSIX bootstrap syntax
        if: runner.os != 'Windows'
        run: sh -n skills/sustech-course-advisor/scripts/bootstrap.sh

      - name: Validate PowerShell bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("skills/sustech-course-advisor/scripts/bootstrap.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Check patch whitespace
        run: git diff --check

      - name: Inspect package contents
        run: npm pack --dry-run
