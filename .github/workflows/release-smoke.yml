name: Release smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published advisor version without the v prefix
        required: true
        default: "0.2.6"
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve current Release version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the current package version
        id: package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$REQUESTED_VERSION" = "$package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  install:
    needs: version
    name: Install v${{ needs.version.outputs.value }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('v{0}', needs.version.outputs.value) }}

      - name: Set up supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.0
          cache: npm

      - name: Verify the checked-out package version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.value }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$EXPECTED_VERSION" = "$package_version"

      - name: Install from the public Release on macOS or Linux
        if: runner.os != 'Windows'
        env:
          SUSTECH_ADVISOR_VERSION: ${{ needs.version.outputs.value }}
          SUSTECH_ADVISOR_INSTALL_ROOT: ${{ runner.temp }}/sustech-course-advisor-release-smoke
        run: sh skills/sustech-course-advisor/scripts/bootstrap.sh

      - name: Install from the public Release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SUSTECH_ADVISOR_VERSION: ${{ needs.version.outputs.value }}
          SUSTECH_ADVISOR_INSTALL_ROOT: ${{ runner.temp }}/sustech-course-advisor-release-smoke
        run: '& ./skills/sustech-course-advisor/scripts/bootstrap.ps1'

      - name: Diagnose a failed Windows consumer install
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        env:
          SUSTECH_ADVISOR_INSTALL_ROOT: ${{ runner.temp }}/sustech-course-advisor-release-smoke
        run: |
          $packageRoot = Join-Path $env:SUSTECH_ADVISOR_INSTALL_ROOT "packages"
          node --version
          npm.cmd --version
          if (Test-Path (Join-Path $packageRoot "package.json")) {
            Write-Output "Consumer manifest:"
            Get-Content (Join-Path $packageRoot "package.json")
          }
          if (-not (Test-Path $packageRoot)) {
            Write-Output "The consumer package root was not created before the failure."
            exit 0
          }
          Push-Location -LiteralPath $packageRoot
          try {
            if (Test-Path "package-lock.json") {
              Write-Output "Advisor lock entry:"
              node -e "const l=require('./package-lock.json'); console.log(JSON.stringify(l.packages?.['node_modules/sustech-course-advisor'] ?? null, null, 2))"
            }
            Write-Output "Installed dependency tree:"
            npm.cmd ls --all --json
          } finally {
            Pop-Location
          }
          exit 0
